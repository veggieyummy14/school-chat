<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background-color: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
#setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 15px; }
input, button { padding: 12px 16px; font-size: 16px; border-radius: 8px; border: none; outline: none; }
input { background: #1e1e1e; color: #fff; border: 1px solid #333; width: 280px; text-align: center; }
button { background: #007bff; color: #fff; font-weight: bold; cursor: pointer; width: 280px; }
button:hover { background: #0056b3; }
#chat-screen { display: none; flex-direction: column; height: 100vh; }
header { background: #1e1e1e; padding: 15px; text-align: center; font-weight: bold; border-bottom: 1px solid #333; }
#messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.msg { background: #2a2a2a; padding: 10px 14px; border-radius: 8px; max-width: 75%; width: fit-content; word-break: break-word; }
.msg.me { background: #007bff; align-self: flex-end; }
.msg .author { font-size: 11px; opacity: 0.7; margin-bottom: 4px; display: block; }
#input-area { display: flex; padding: 15px; background: #1e1e1e; gap: 10px; border-top: 1px solid #333; }
#input-area input { flex: 1; text-align: left; }
#input-area button { width: auto; }
</style>
</head>
<body>

<div id="setup-screen">
<h2>Secure Chat</h2>
<input type="text" id="username" placeholder="Your Name" />
<input type="text" id="room-code" placeholder="Room Code (e.g. 1234)" />
<button onclick="startChat()">Join Room</button>
</div>

<div id="chat-screen">
<header id="room-header">Room: -</header>
<div id="messages"></div>
<div id="input-area">
<input type="text" id="message-input" placeholder="Type a message..." onkeydown="handleKey(event)" />
<button onclick="sendMessage()">Send</button>
</div>
</div>

<script>
// Relays over KV storage CDN that bypasses developer site filters
let myName = "";
let roomCode = "";
let lastMsgCount = 0;

function getApiUrl() {
return `https://kvdb.io/8x4Z9nQ7wE2kP5mL1s/room_${roomCode}`;
}

function startChat() {
myName = document.getElementById("username").value.trim();
roomCode = document.getElementById("room-code").value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

if (!myName || !roomCode) {
alert("Please enter a name and room code.");
return;
}

document.getElementById("setup-screen").style.display = "none";
document.getElementById("chat-screen").style.display = "flex";
document.getElementById("room-header").innerText = "Room: " + roomCode;

fetchMessages();
setInterval(fetchMessages, 1500);
}

async function fetchMessages() {
try {
const res = await fetch(getApiUrl());
if (!res.ok) return;
const allMessages = await res.json();

if (Array.isArray(allMessages) && allMessages.length !== lastMsgCount) {
const container = document.getElementById("messages");
container.innerHTML = "";
allMessages.forEach(msg => {
displayMessage(msg.sender, msg.text, msg.sender === myName);
});
lastMsgCount = allMessages.length;
}
} catch (err) {
// Silent fail while waiting for room creation
}
}

async function sendMessage() {
const input = document.getElementById("message-input");
const text = input.value.trim();
if (!text) return;

input.value = "";

try {
let currentMsgs = [];
try {
const res = await fetch(getApiUrl());
if (res.ok) currentMsgs = await res.json();
} catch(e) {}

if (!Array.isArray(currentMsgs)) currentMsgs = [];

currentMsgs.push({ sender: myName, text: text, time: Date.now() });

await fetch(getApiUrl(), {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify(currentMsgs)
});

fetchMessages();
} catch (err) {
alert("Unable to send message on this network.");
}
}

function handleKey(e) {
if (e.key === "Enter") sendMessage();
}

function displayMessage(sender, text, isMe) {
const container = document.getElementById("messages");
const div = document.createElement("div");
div.className = "msg" + (isMe ? " me" : "");
div.innerHTML = `<span class="author">${sender}</span>${text}`;
container.appendChild(div);
container.scrollTop = container.scrollHeight;
}
</script>
</body>
</html>
