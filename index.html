                <script>(function installLiveweaveConsoleBridge() {
        if (window.__liveweaveConsoleBridge) return;
        window.__liveweaveConsoleBridge = true;

        function format(value) {
            if (typeof value === 'string') return value;
            if (typeof value === 'undefined') return 'undefined';
            if (typeof value === 'function') return value.toString();
            if (value instanceof Error) return value.name + ': ' + value.message;
            if (value instanceof Element) return value.outerHTML;
            try {
                var seen = [];
                return JSON.stringify(value, function(key, item) {
                    if (typeof item === 'object' && item !== null) {
                        if (seen.indexOf(item) !== -1) return '[Circular]';
                        seen.push(item);
                    }
                    return item;
                }, 2);
            } catch (err) {
                return String(value);
            }
        }

        function send(type, values, id) {
            parent.postMessage({
                source: 'liveweave-preview-console',
                type: type,
                id: id || '',
                values: (values || []).map(format)
            }, '*');
        }

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(level) {
            var original = console[level];
            console[level] = function() {
                var args = Array.prototype.slice.call(arguments);
                send(level === 'log' || level === 'debug' ? 'log' : level, args);
                if (original) original.apply(console, args);
            };
        });

        window.addEventListener('error', function(event) {
            send('error', [event.message + (event.lineno ? ' (line ' + event.lineno + ')' : '')]);
        });
        window.addEventListener('unhandledrejection', function(event) {
            send('error', ['Unhandled promise rejection:', event.reason]);
        });
        window.addEventListener('message', function(event) {
            var message = event.data || {};
            if (event.source !== parent || message.source !== 'liveweave-parent-console' || message.type !== 'evaluate') return;
            try {
                var result = (0, eval)(message.code);
                Promise.resolve(result).then(function(value) {
                    send('result', [value], message.id);
                }, function(error) {
                    send('error', [error], message.id);
                });
            } catch (error) {
                send('error', [error], message.id);
            }
        });
        send('ready', []);
    })();</script>
                <script>(function installPreviewLinkGuard() {
        var noticeTimer;

        function showNotice(message) {
            var notice = document.getElementById('lw-preview-link-notice');
            if (!notice) {
                notice = document.createElement('div');
                notice.id = 'lw-preview-link-notice';
                notice.setAttribute('role', 'status');
                notice.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:calc(100% - 24px);padding:10px 14px;border-radius:9px;background:#17212d;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;';
                document.body.appendChild(notice);
            }
            notice.textContent = message;
            notice.hidden = false;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(function() { notice.hidden = true; }, 3500);
        }

        document.addEventListener('click', function(event) {
            var link = event.target.closest && event.target.closest('a[href]');
            if (!link || event.defaultPrevented) return;

            var href = (link.getAttribute('href') || '').trim();
            if (href.charAt(0) === '#') {
                event.preventDefault();
                var fragment = href.slice(1);
                if (!fragment) {
                    window.scrollTo(0, 0);
                    return;
                }
                try { fragment = decodeURIComponent(fragment); } catch (error) {}
                var target = document.getElementById(fragment) || document.getElementsByName(fragment)[0];
                if (target) target.scrollIntoView();
                return;
            }

            if (/^(https?:)?\/\//i.test(href)) {
                event.preventDefault();
                window.open(href, '_blank', 'noopener,noreferrer');
                return;
            }

            if (/^(mailto:|tel:)/i.test(href)) return;

            event.preventDefault();
            showNotice('This page cannot be opened in the preview.');
        }, true);

<script>
// Application State
let state = {
username: '',
room: '',
color: '#6366f1',
audioEnabled: true,
messages: []
};

const AVATAR_COLORS = [
'#6366f1', // Indigo
'#ec4899', // Pink
'#10b981', // Emerald
'#f59e0b', // Amber
'#3b82f6', // Blue
'#8b5cf6', // Purple
'#ef4444' // Red
];

const EMOJIS = ['😊', '😂', '🔥', '👍', '💀', '👀', '🎉', '❤️', '😎', '📚', '✨', '👋', '💯', '🤔', '🙌', '🚀', '😴', '💻'];

// Sync Channels
let broadcastChannel = null;

// Initialize UI components on load
window.onload = function() {
renderColorPicker();
renderEmojiPicker();
checkUrlParams();
setupAudio();
};

// Render Color Options
function renderColorPicker() {
const container = document.getElementById('color-picker-container');
container.innerHTML = AVATAR_COLORS.map((color, idx) => `
<button type="button" onclick="selectColor('${color}')"
class="color-btn w-8 h-8 rounded-full flex items-center justify-center transition transform hover:scale-110"
style="background-color: ${color}" data-color="${color}">
${idx === 0 ? '<i class="fa-solid fa-check text-xs text-white"></i>' : ''}
</button>
`).join('');
state.color = AVATAR_COLORS[0];
}

function selectColor(color) {
state.color = color;
document.querySelectorAll('.color-btn').forEach(btn => {
btn.innerHTML = btn.getAttribute('data-color') === color ? '<i class="fa-solid fa-check text-xs text-white"></i>' : '';
});
}

// Render Emojis
function renderEmojiPicker() {
const grid = document.getElementById('emoji-grid');
grid.innerHTML = EMOJIS.map(emoji => `
<button type="button" onclick="insertEmoji('${emoji}')" class="hover:bg-slate-700 p-1 rounded text-center transition">
${emoji}
</button>
`).join('');
}

function toggleEmojiPicker() {
const picker = document.getElementById('emoji-picker');
picker.classList.toggle('hidden');
}

function insertEmoji(emoji) {
const input = document.getElementById('input-message');
input.value += emoji;
input.focus();
toggleEmojiPicker();
}

// Generate Random Room Code
function generateRandomRoom() {
const randomCode = 'room-' + Math.floor(1000 + Math.random() * 9000);
document.getElementById('input-room').value = randomCode;
}

// Check for ?room= parameter in URL
function checkUrlParams() {
const urlParams = new URLSearchParams(window.location.search);
const roomParam = urlParams.get('room');
if (roomParam) {
document.getElementById('input-room').value = roomParam;
}
}

// Handle Room Entry
function handleJoin(e) {
e.preventDefault();
const usernameInput = document.getElementById('input-username').value.trim();
const roomInput = document.getElementById('input-room').value.trim().toLowerCase();

if (!usernameInput || !roomInput) return;

state.username = usernameInput;
state.room = roomInput;

// Update UI Header
document.getElementById('header-room-badge').innerText = state.room;
document.getElementById('setup-screen').classList.add('hidden');

// Setup Synchronization Channel for Multi-Tab communication
setupBroadcastChannel();

// Load Saved Messages for Room
loadRoomHistory();

// Notify System message
pushSystemMessage(`${state.username} joined the chat.`);
showToast(`Joined room "${state.room}"`, 'success');
}

function setupBroadcastChannel() {
if ('BroadcastChannel' in window) {
broadcastChannel = new BroadcastChannel(`schoolchat_${state.room}`);
broadcastChannel.onmessage = (event) => {
const data = event.data;
if (data.type === 'NEW_MESSAGE') {
appendMessage(data.payload, false);
playNotificationSound();
} else if (data.type === 'CLEAR_CHAT') {
state.messages = [];
renderMessages();
}
};
}

// Sync using storage events for fallback
window.addEventListener('storage', (e) => {
if (e.key === `schoolchat_msgs_${state.room}`) {
loadRoomHistory();
}
});
}

// Send New Chat Message
function sendMessage(e) {
e.preventDefault();
const input = document.getElementById('input-message');
const text = input.value.trim();

if (!text) return;

const message = {
id: Date.now() + '_' + Math.random().toString(36).substr(2, 9),
sender: state.username,
color: state.color,
text: text,
timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
isSystem: false
};

// Append locally
appendMessage(message, true);

// Broadcast to other open browser tabs
if (broadcastChannel) {
broadcastChannel.postMessage({ type: 'NEW_MESSAGE', payload: message });
}

// Clear Input
input.value = '';
input.focus();
}

// Append message to state and view
function appendMessage(msg, isSelf = false) {
state.messages.push(msg);
saveRoomHistory();
renderMessages();
}

function pushSystemMessage(text) {
const sysMsg = {
id: Date.now() + '_sys',
text: text,
isSystem: true,
timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
};
appendMessage(sysMsg);
}

// Render Chat Message UI
function renderMessages() {
const container = document.getElementById('messages-container');
const emptyState = document.getElementById('empty-state');

if (state.messages.length === 0) {
container.innerHTML = '';
container.appendChild(emptyState);
return;
}

container.innerHTML = state.messages.map(msg => {
if (msg.isSystem) {
return `
<div class="flex justify-center my-2">
<span class="bg-slate-800 text-slate-400 text-[11px] px-3 py-1 rounded-full border border-slate-700/50">
${escapeHtml(msg.text)} · ${msg.timestamp}
</span>
</div>
`;
}

const isMe = msg.sender === state.username;
const initials = msg.sender.substring(0, 2).toUpperCase();

return `
<div class="flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''} group">
<!-- Avatar -->
<div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs shadow-md shrink-0 mt-0.5"
style="background-color: ${msg.color || '#6366f1'}">
${initials}
</div>

<!-- Message Content -->
<div class="max-w-[75%] sm:max-w-[65%] flex flex-col ${isMe ? 'items-end' : 'items-start'}">
<div class="flex items-center gap-1.5 mb-1 text-[11px] text-slate-400 px-1">
<span class="font-semibold ${isMe ? 'text-brand-400' : 'text-slate-300'}">${escapeHtml(msg.sender)}</span>
<span>·</span>
<span>${msg.timestamp}</span>
</div>
<div class="px-4 py-2.5 rounded-2xl text-sm break-words shadow-sm ${
isMe
? 'bg-brand-600 text-white rounded-tr-xs'
: 'bg-slate-800 text-slate-100 border border-slate-700/60 rounded-tl-xs'
}">
${escapeHtml(msg.text)}
</div>
</div>
</div>
`;
}).join('');

// Scroll to bottom
container.scrollTop = container.scrollHeight;
}

// Local Storage Management
function saveRoomHistory() {
try {
localStorage.setItem(`schoolchat_msgs_${state.room}`, JSON.stringify(state.messages));
} catch (err) {
console.warn('Storage limit reached');
}
}

function loadRoomHistory() {
const saved = localStorage.getItem(`schoolchat_msgs_${state.room}`);
if (saved) {
try {
state.messages = JSON.parse(saved);
renderMessages();
} catch (e) {
state.messages = [];
}
}
}

function confirmClearChat() {
if (confirm("Clear local messages in this room?")) {
state.messages = [];
saveRoomHistory();
renderMessages();
if (broadcastChannel) {
broadcastChannel.postMessage({ type: 'CLEAR_CHAT' });
}
showToast("Chat history cleared", "info");
}
}

// Copy Invite URL
function copyInviteLink() {
const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(state.room)}`;

// Clipboard API fallback for iFrame compatibility
const tempInput = document.createElement('input');
tempInput.value = inviteUrl;
document.body.appendChild(tempInput);
tempInput.select();
document.execCommand('copy');
document.body.removeChild(tempInput);

showToast("Invite link copied to clipboard!", "success");
}

let audioCtx = null;
function setupAudio() {
try {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
} catch (e) {}
}

function toggleAudio() {
state.audioEnabled = !state.audioEnabled;
const btn = document.getElementById('btn-audio');
if (state.audioEnabled) {
btn.classList.remove('text-slate-500');
btn.classList.add('text-slate-200');
btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
showToast("Sound notifications enabled", "info");
} else {
btn.classList.remove('text-slate-200');
btn.classList.add('text-slate-500');
btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
showToast("Sound notifications muted", "info");
}
}

function playNotificationSound() {
if (!state.audioEnabled || !audioCtx) return;
try {
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
osc.type = 'sine';
osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15); // A5
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start();
osc.stop(audioCtx.currentTime + 0.15);
} catch (e) {}
}

function leaveRoom() {
if (confirm("Leave this room?")) {
pushSystemMessage(`${state.username} left the chat.`);
document.getElementById('setup-screen').classList.remove('hidden');
}
}

// Helper: Toast Notifications
function showToast(message, type = 'info') {
const container = document.getElementById('toast-container');
const toast = document.createElement('div');

const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800 border border-slate-700';

toast.className = `${bgClass} text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 flex items-center gap-2 pointer-events-auto`;
toast.innerHTML = `
<i class="${type === 'success' ? 'fa-solid fa-check-circle' : 'fa-solid fa-info-circle'}"></i>
<span>${escapeHtml(message)}</span>
`;

container.appendChild(toast);

setTimeout(() => {
toast.classList.remove('translate-y-2', 'opacity-0');
}, 10);

setTimeout(() => {
toast.classList.add('opacity-0', 'translate-y-2');
setTimeout(() => toast.remove(), 300);
}, 3000);
}

// Helper: Escape HTML string
function escapeHtml(str) {
return str.replace(/[&<>"']/g, function(m) {
return {
'&': '&amp;',
'<': '&lt;',
'>': '&gt;',
'"': '&quot;',
"'": '&#039;'
}[m];
});
}
</script>
